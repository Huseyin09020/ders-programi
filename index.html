<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ders Çalışma Planlayıcı</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5; }
    .container { max-width: 850px; margin: 0 auto; background: var(--card); padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #0f172a; }
    p.desc { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-bottom: 10px; align-items: center; }
    .btn-del { background: #fee2e2; color: #dc2626; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-add { background: #e0e7ff; color: var(--primary); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 4px; }
    .btn-generate { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    .btn-generate:hover { background: var(--primary-hover); }
    .btn-generate:disabled { background: #a5b4fc; cursor: not-allowed; }
    #output { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: none; }
    #output h2 { font-size: 20px; margin-bottom: 16px; }
    .plan-box { background: #f1f5f9; padding: 20px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; color: #334155; }
    .loading { font-size: 15px; color: var(--primary); font-weight: 600; text-align: center; margin-top: 16px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Ders Çalışma Planlayıcı</h1>
  <p class="desc">Derslerini ve YouTube oynatma listelerini gir, yapay zeka kalan gününe göre çalışma planını çıkarsın.</p>

  <div class="form-group">
    <label for="apiKey">Gemini API Anahtarın:</label>
    <input type="password" id="apiKey" placeholder="Google AI Studio'dan aldığın API Key'i yapıştır">
  </div>

  <div class="form-group">
    <label for="days">Sınava Kalan Gün Sayısı:</label>
    <input type="number" id="days" placeholder="Örn: 46" min="1">
  </div>

  <div class="form-group">
    <label>Dersler ve Playlist Linkleri:</label>
    <div id="courseList">
      <div class="row">
        <input type="text" class="course-name" placeholder="Ders Adı (Örn: KPSS Coğrafya)">
        <input type="text" class="course-link" placeholder="YouTube Playlist Linki">
        <button type="button" class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
    </div>
    <button type="button" class="btn-add" onclick="addRow()">+ Ders Ekle</button>
  </div>

  <button type="button" class="btn-generate" id="btnSubmit" onclick="generatePlan()">Çalışma Programını Oluştur</button>

  <div class="loading" id="loadingText">Yapay zeka modelleri taranıyor ve planın hazırlanıyor, lütfen bekleyin...</div>

  <div id="output">
    <h2>Senin İçin Hazırlanan Çalışma Programı</h2>
    <div class="plan-box" id="planText"></div>
  </div>
</div>

<script>
  function addRow() {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <input type="text" class="course-name" placeholder="Ders Adı">
      <input type="text" class="course-link" placeholder="YouTube Playlist Linki">
      <button type="button" class="btn-del" onclick="removeRow(this)">✕</button>
    `;
    document.getElementById('courseList').appendChild(div);
  }

  function removeRow(btn) {
    const rows = document.querySelectorAll('#courseList .row');
    if (rows.length > 1) {
      btn.parentElement.remove();
    } else {
      alert("En az bir ders kalmalıdır.");
    }
  }

  async function generatePlan() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const days = document.getElementById('days').value.trim();
    const names = document.querySelectorAll('.course-name');
    const links = document.querySelectorAll('.course-link');

    if (!apiKey) {
      alert("Lütfen Gemini API anahtarını girin.");
      return;
    }
    if (!days || days <= 0) {
      alert("Lütfen geçerli bir kalan gün sayısı girin.");
      return;
    }

    let courseData = [];
    for (let i = 0; i < names.length; i++) {
      const name = names[i].value.trim();
      const link = links[i].value.trim();
      if (name) {
        courseData.push(`- Ders: ${name} (Oynatma Listesi: ${link || 'Belirtilmedi'})`);
      }
    }

    if (courseData.length === 0) {
      alert("En az bir ders adı girmelisin.");
      return;
    }

    const btn = document.getElementById('btnSubmit');
    const loading = document.getElementById('loadingText');
    const output = document.getElementById('output');
    const planText = document.getElementById('planText');

    btn.disabled = true;
    loading.style.display = 'block';
    output.style.display = 'none';

    const prompt = `Sen uzman bir sınav koçu ve eğitim danışmanısın.
Öğrencinin sınava tam ${days} günü kaldı.
Çalışması gereken dersler ve oynatma listeleri:
${courseData.join('\n')}

Lütfen bu ${days} gün için dengeli, mantıklı, genel tekrarlar, branş denemeleri ve son haftaya genel denemeler koyarak gün gün bir çalışma programı hazırla.`;

    // Denenecek güncel ve geçerli modeller sırasıyla
    const modelsToTry = [
      "gemini-2.5-flash",
      "gemini-2.0-flash",
      "gemini-2.0-flash-lite",
      "gemini-1.5-flash-8b"
    ];

    let success = false;
    let lastError = "";

    for (const model of modelsToTry) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          planText.textContent = data.candidates[0].content.parts[0].text;
          output.style.display = 'block';
          success = true;
          break;
        } else if (data.error) {
          lastError = data.error.message;
        }
      } catch (e) {
        lastError = e.message;
      }
    }

    if (!success) {
      alert("Hata oluştu: " + lastError);
    }

    btn.disabled = false;
    loading.style.display = 'none';
  }
</script>

</body>
</html>
