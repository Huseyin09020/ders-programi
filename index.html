<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel Sınav Ajandası</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --paper: #fffef9;
      --paper-border: #e2d9c8;
      --grid-line: rgba(79, 70, 229, 0.05);
      --text: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Kareli Defter Kağıdı Efekti */
    body {
      background-color: #f6f5f0;
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      padding: 20px 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
      border: 1px solid #e7e5e4;
      position: relative;
    }

    /* Ajanda başlık spiral hissi */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #e2d9c8;
    }
    .header h1 { font-size: 24px; font-weight: 800; color: #1e1b4b; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header p { color: #78716c; font-size: 14px; margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #44403c; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d6d3d1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fafaf9;
      transition: all 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.12);
    }

    .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .btn-del { background: #fee2e2; color: #dc2626; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-add { background: #e0e7ff; color: var(--primary); border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 4px; }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #4338ca, #6366f1);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 14px rgba(67, 56, 202, 0.25);
      transition: all 0.2s;
    }
    .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(67, 56, 202, 0.35); }
    .btn-generate:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }

    .loading { display: none; text-align: center; margin-top: 20px; padding: 16px; background: #eef2ff; border-radius: 10px; color: var(--primary); font-weight: 600; font-size: 14px; }

    #output { margin-top: 30px; padding-top: 24px; border-top: 2px dashed #e2d9c8; display: none; }
    .output-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .output-top h2 { font-size: 20px; font-weight: 800; color: #1e1b4b; }
    .btn-print { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

    /* AJANDA KARTLARI (Çizgili & Kareli Post-it Havası) */
    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .agenda-card {
      background-color: var(--paper);
      /* Kartın kendi içinde defter satır çizgileri */
      background-image: linear-gradient(#f1eee7 1px, transparent 1px);
      background-size: 100% 28px;
      border: 1px solid var(--paper-border);
      border-left: 5px solid #ef4444; /* Defter marjin çizgisi */
      border-radius: 10px;
      padding: 16px 14px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.04);
      position: relative;
      transition: transform 0.15s ease;
    }
    .agenda-card:hover { transform: translateY(-2px); box-shadow: 2px 6px 12px rgba(0,0,0,0.07); }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid #e7e2d7;
    }
    .card-title {
      font-weight: 800;
      color: #1e1b4b;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-badge {
      font-size: 11px;
      background: #e0e7ff;
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #334155;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(226, 217, 200, 0.4);
    }
    .task-item input[type="checkbox"] {
      width: auto;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .version-tag { font-size: 11px; color: #a8a29e; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📖 Kişisel Çalışma Ajandası</h1>
    <p>Hedef gününü ve derslerini gir, çizgili ajanda kartların hazır olsun.</p>
  </div>

  <div class="form-group">
    <label for="apiKey">Gemini API Anahtarın:</label>
    <input type="password" id="apiKey" placeholder="API Key'i yapıştır">
  </div>

  <div class="form-group">
    <label for="days">Sınava Kalan Gün Sayısı:</label>
    <input type="number" id="days" placeholder="Örn: 46" min="1">
  </div>

  <div class="form-group">
    <label>Dersler ve Playlist Linkleri:</label>
    <div id="courseList">
      <div class="row">
        <input type="text" class="course-name" placeholder="Ders Adı (Örn: KPSS Tarih)">
        <input type="text" class="course-link" placeholder="YouTube Playlist Linki">
        <button type="button" class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
    </div>
    <button type="button" class="btn-add" onclick="addRow()">+ Ders Ekle</button>
  </div>

  <button type="button" class="btn-generate" id="btnSubmit" onclick="generatePlan()">✨ Ajandama Yazdır</button>

  <div class="loading" id="loadingText">
    ✍️ Ajandan dolduruluyor, gün gün kartlar hazırlanıyor...
  </div>

  <div id="output">
    <div class="output-top">
      <h2>📌 Sınav Ajandan ve Görevlerin</h2>
      <button class="btn-print" onclick="window.print()">🖨️ Yazdır / PDF</button>
    </div>
    <div class="agenda-grid" id="agendaGrid"></div>
  </div>
  
  <div class="version-tag">Sürüm: v5 (Defter & Çizgili Ajanda Teması)</div>
</div>

<script>
  function addRow() {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <input type="text" class="course-name" placeholder="Ders Adı">
      <input type="text" class="course-link" placeholder="YouTube Playlist Linki">
      <button type="button" class="btn-del" onclick="removeRow(this)">✕</button>
    `;
    document.getElementById('courseList').appendChild(div);
  }

  function removeRow(btn) {
    const rows = document.querySelectorAll('#courseList .row');
    if (rows.length > 1) btn.parentElement.remove();
    else alert("En az bir ders kalmalıdır.");
  }

  async function generatePlan() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const days = parseInt(document.getElementById('days').value.trim(), 10);
    const names = document.querySelectorAll('.course-name');
    const links = document.querySelectorAll('.course-link');

    if (!apiKey) return alert("Lütfen API anahtarını girin.");
    if (!days || days <= 0) return alert("Geçerli bir gün sayısı girin.");

    let courses = [];
    for (let i = 0; i < names.length; i++) {
      const name = names[i].value.trim();
      const link = links[i].value.trim();
      if (name) courses.push(`${name} (${link || 'Link yok'})`);
    }

    if (courses.length === 0) return alert("En az bir ders girmelisin.");

    const btn = document.getElementById('btnSubmit');
    const loading = document.getElementById('loadingText');
    const output = document.getElementById('output');
    const grid = document.getElementById('agendaGrid');

    btn.disabled = true;
    loading.style.display = 'block';
    output.style.display = 'none';
    grid.innerHTML = '';

    const prompt = `Sen profesyonel bir KPSS ve sınav koçusun.
Öğrencinin sınava tam ${days} günü kaldı.
Dersler: ${courses.join(', ')}

Bana düz metin veya paragraf yazma. SADECE geçerli bir JSON dizisi üret.
Format aynen şu JSON yapısında olmalıdır:
[
  {
    "gun": 1,
    "odak": "Tarih & Coğrafya",
    "gorevler": [
      "Tarih: 2 video izle ve not çıkar",
      "Coğrafya: 1 video izle",
      "Soru Çözümü: 40 soru tamamla"
    ]
  }
]
Son günleri genel deneme ve tekrar kampı olacak şekilde bu JSON yapısını doldur. Sadece JSON döndür.`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("Yapay zekadan yanıt alınamadı.");

      text = text.replace(/```json/g, '').replace(/```/g, '').trim();
      const planData = JSON.parse(text);

      planData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'agenda-card';

        const tasksHtml = item.gorevler.map(g => `
          <li class="task-item">
            <input type="checkbox" onchange="this.parentElement.style.textDecoration = this.checked ? 'line-through' : 'none'; this.parentElement.style.opacity = this.checked ? '0.4' : '1';">
            <span>${g}</span>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="card-head">
            <span class="card-title">📌 Gün ${item.gun}</span>
            <span class="card-badge">${item.odak}</span>
          </div>
          <ul class="task-list">
            ${tasksHtml}
          </ul>
        `;
        grid.appendChild(card);
      });

      output.style.display = 'block';

    } catch (err) {
      alert("Hata: " + err.message);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }
</script>

</body>
</html>
